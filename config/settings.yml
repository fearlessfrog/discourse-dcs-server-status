plugins:
  dcs_server_status_enabled:
    default: false
    client: true
  dcs_server_status_header_enabled:
    default: false
    client: true
  dcs_server_status_header_url:
    default: ""
    client: true
    validator: "DcsServerStatus::HeaderUrlValidator"
  dcs_server_status_username:
    default: ""
    max: 255
  dcs_server_status_password:
    default: ""
    max: 255
    secret: true
  dcs_server_status_server_name:
    default: ""
    max: 512
  dcs_server_status_poll_interval_minutes:
    default: 5
    min: 2
    max: 5
  dcs_server_status_mission_start_time_offset:
    default: ""
    max: 8
    regex: '\A(?:(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?)?\z'
    regex_error: "dcs_server_status.invalid_mission_start_time_offset"
